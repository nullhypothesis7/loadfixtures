apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-config
  namespace: testfixtures-messaging
data:
  kafka-jmx.yml: |
    hostPort: kafka.testfixtures-messaging.svc.cluster.local:9999
    ssl: false
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true

    rules:
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec, topic=(.+)><>OneMinuteRate'
        name: kafka_bytes_in_per_sec
        labels:
          topic: "$1"
        type: GAUGE

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec, topic=(.+)><>OneMinuteRate'
        name: kafka_bytes_out_per_sec
        labels:
          topic: "$1"
        type: GAUGE

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec, topic=(.+)><>OneMinuteRate'
        name: kafka_messages_in_per_sec_jmx
        labels:
          topic: "$1"
        type: GAUGE

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>OneMinuteRate'
        name: kafka_bytes_in_per_sec_total
        type: GAUGE

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>OneMinuteRate'
        name: kafka_bytes_out_per_sec_total
        type: GAUGE

      - pattern: 'kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value'
        name: kafka_under_replicated_partitions
        type: GAUGE

      - pattern: 'kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value'
        name: kafka_active_controller_count
        type: GAUGE
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: testfixtures-messaging
spec:
  selector:
    app: kafka-exporter
  ports:
  - port: 9308
    targetPort: 9308
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: testfixtures-messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:latest
        args:
        - --kafka.server=kafka.testfixtures-messaging.svc.cluster.local:9092
        - --topic.filter=.*
        ports:
        - containerPort: 9308
          name: metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9308
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-jmx-exporter
  namespace: testfixtures-messaging
spec:
  selector:
    app: kafka-jmx-exporter
  ports:
  - port: 5556
    targetPort: 5556
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-jmx-exporter
  namespace: testfixtures-messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-jmx-exporter
  template:
    metadata:
      labels:
        app: kafka-jmx-exporter
    spec:
      containers:
      - name: kafka-jmx-exporter
        image: sscaling/jmx-prometheus-exporter:0.12.0
        env:
        - name: _JAVA_OPTIONS
          value: "-Xmx256m -Xms64m -XX:MaxMetaspaceSize=128m"
        ports:
        - containerPort: 5556
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /opt/jmx_exporter/config.yml
          subPath: kafka-jmx.yml
        readinessProbe:
          httpGet:
            path: /metrics
            port: 5556
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 30
          failureThreshold: 6
        resources:
          requests:
            memory: "512Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: kafka-jmx-config
