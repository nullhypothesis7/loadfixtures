# SecretProviderClass — mounts Azure Key Vault secrets into pods via the CSI
# driver and syncs them as a Kubernetes Secret so they can also be consumed
# as environment variables.
#
# Placeholder substitution is handled by scripts/azure-deploy.sh, which reads
# `terraform output` values and runs envsubst before applying.
#
# Required placeholders (set by azure-deploy.sh):
#   WORKLOAD_IDENTITY_CLIENT_ID  — terraform output workload_identity_client_id
#   KEY_VAULT_NAME               — terraform output key_vault_name
#   TENANT_ID                    — az account show --query tenantId
#   APP_NAMESPACE                — terraform output app_namespace
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: testfixtures-kv-secrets
  namespace: ${APP_NAMESPACE}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: pg-connection-string
          objectType: secret
        - |
          objectName: pg-admin-password
          objectType: secret

  # secretObjects syncs each vault secret into a single K8s Secret.
  # The K8s Secret is only created (and kept current) while at least one pod
  # mounts this SecretProviderClass as a CSI volume — that is why the
  # deployment includes a /mnt/secrets volume mount even though the app reads
  # credentials from env vars rather than files.
  #
  # redis-password, kafka-username, kafka-password are intentionally omitted:
  # they may not exist in Key Vault when those services run without auth.
  # The deployment.yaml references them with optional: true so pods start fine.
  secretObjects:
    - secretName: testfixtures-kv-secrets
      type: Opaque
      data:
        - objectName: pg-connection-string
          key: PG_CONNECTION_STRING
        - objectName: pg-admin-password
          key: DB_PASS_BANKSCHEMA
