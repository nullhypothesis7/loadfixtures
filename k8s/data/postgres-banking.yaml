apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-banking-initdb
  namespace: testfixtures-data
data:
  banking_schema.sql: |
    DROP TABLE IF EXISTS transactions;
    DROP TABLE IF EXISTS accounts;
    DROP TABLE IF EXISTS customers;

    CREATE TABLE customers (
        id            INTEGER        PRIMARY KEY,
        first_name    VARCHAR(100)   NOT NULL,
        last_name     VARCHAR(100)   NOT NULL,
        email         VARCHAR(255)   NOT NULL,
        phone         VARCHAR(30)    NOT NULL,
        created_date  DATE           NOT NULL,
        status        VARCHAR(20)    NOT NULL CHECK (status IN ('active', 'inactive', 'suspended'))
    );

    CREATE TABLE accounts (
        id            INTEGER        PRIMARY KEY,
        customer_id   INTEGER        NOT NULL REFERENCES customers(id),
        account_type  VARCHAR(20)    NOT NULL CHECK (account_type IN ('checking', 'savings', 'money_market', 'cd')),
        status        VARCHAR(20)    NOT NULL CHECK (status IN ('active', 'closed', 'frozen')),
        balance       NUMERIC(12,2)  NOT NULL,
        opened_date   DATE           NOT NULL
    );

    CREATE TABLE transactions (
        id                INTEGER        PRIMARY KEY,
        account_id        INTEGER        NOT NULL REFERENCES accounts(id),
        transaction_type  VARCHAR(10)    NOT NULL CHECK (transaction_type IN ('credit', 'debit')),
        amount            NUMERIC(12,2)  NOT NULL,
        transaction_date  DATE           NOT NULL,
        description       VARCHAR(255),
        status            VARCHAR(20)    NOT NULL CHECK (status IN ('pending', 'settled', 'reversed', 'failed'))
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-banking-headless
  namespace: testfixtures-data
spec:
  clusterIP: None
  selector:
    app: postgres-banking
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-banking
  namespace: testfixtures-data
spec:
  selector:
    app: postgres-banking
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-banking
  namespace: testfixtures-data
spec:
  serviceName: postgres-banking-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres-banking
  template:
    metadata:
      labels:
        app: postgres-banking
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-banking
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-banking
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-banking
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "bankinguser", "-d", "bankingdb"]
          timeoutSeconds: 5
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "bankinguser", "-d", "bankingdb"]
          timeoutSeconds: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - name: initdb
        configMap:
          name: postgres-banking-initdb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: hostpath
      resources:
        requests:
          storage: 2Gi
