apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-testdb-initdb
  namespace: testfixtures-data
data:
  smoke_test.sql: |
    DROP TABLE IF EXISTS smoke_users;

    CREATE TABLE smoke_users (
        id           INTEGER      PRIMARY KEY,
        first_name   VARCHAR(100) NOT NULL,
        last_name    VARCHAR(100) NOT NULL,
        email        VARCHAR(255) NOT NULL,
        created_date DATE         NOT NULL,
        status       VARCHAR(20)  NOT NULL CHECK (status IN ('active', 'inactive', 'pending'))
    );
  example_table.sql: |
    DROP TABLE IF EXISTS example_table;

    CREATE TABLE example_table (
        id           INTEGER      PRIMARY KEY,
        first_name   VARCHAR(100) NOT NULL,
        last_name    VARCHAR(100) NOT NULL,
        email        VARCHAR(255) NOT NULL,
        created_date DATE         NOT NULL,
        status       VARCHAR(20)  NOT NULL CHECK (status IN ('active', 'inactive', 'pending'))
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-testdb-headless
  namespace: testfixtures-data
spec:
  clusterIP: None
  selector:
    app: postgres-testdb
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-testdb
  namespace: testfixtures-data
spec:
  selector:
    app: postgres-testdb
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-testdb
  namespace: testfixtures-data
spec:
  serviceName: postgres-testdb-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres-testdb
  template:
    metadata:
      labels:
        app: postgres-testdb
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-testdb
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-testdb
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-testdb
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "testuser", "-d", "testdb"]
          timeoutSeconds: 5
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "testuser", "-d", "testdb"]
          timeoutSeconds: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: initdb
        configMap:
          name: postgres-testdb-initdb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: hostpath
      resources:
        requests:
          storage: 1Gi
