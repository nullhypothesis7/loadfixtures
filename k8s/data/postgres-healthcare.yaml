apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-healthcare-initdb
  namespace: testfixtures-data
data:
  healthcare_schema.sql: |
    DROP TABLE IF EXISTS encounters;
    DROP TABLE IF EXISTS providers;
    DROP TABLE IF EXISTS patients;

    CREATE TABLE patients (
        id             INTEGER      PRIMARY KEY,
        first_name     VARCHAR(100) NOT NULL,
        last_name      VARCHAR(100) NOT NULL,
        email          VARCHAR(255) NOT NULL,
        phone          VARCHAR(30)  NOT NULL,
        date_of_birth  DATE         NOT NULL,
        gender         VARCHAR(30)  NOT NULL CHECK (gender IN ('male', 'female', 'non_binary', 'prefer_not_to_say')),
        status         VARCHAR(20)  NOT NULL CHECK (status IN ('active', 'inactive', 'deceased'))
    );

    CREATE TABLE providers (
        id              INTEGER      PRIMARY KEY,
        first_name      VARCHAR(100) NOT NULL,
        last_name       VARCHAR(100) NOT NULL,
        email           VARCHAR(255) NOT NULL,
        specialty       VARCHAR(50)  NOT NULL,
        license_number  VARCHAR(36)  NOT NULL,
        status          VARCHAR(20)  NOT NULL CHECK (status IN ('active', 'inactive', 'on_leave'))
    );

    CREATE TABLE encounters (
        id              INTEGER      PRIMARY KEY,
        patient_id      INTEGER      NOT NULL REFERENCES patients(id),
        provider_id     INTEGER      NOT NULL REFERENCES providers(id),
        encounter_date  DATE         NOT NULL,
        encounter_type  VARCHAR(20)  NOT NULL CHECK (encounter_type IN ('inpatient', 'outpatient', 'emergency', 'telehealth')),
        diagnosis_code  VARCHAR(10),
        status          VARCHAR(20)  NOT NULL CHECK (status IN ('scheduled', 'completed', 'cancelled', 'no_show'))
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-healthcare-headless
  namespace: testfixtures-data
spec:
  clusterIP: None
  selector:
    app: postgres-healthcare
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-healthcare
  namespace: testfixtures-data
spec:
  selector:
    app: postgres-healthcare
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-healthcare
  namespace: testfixtures-data
spec:
  serviceName: postgres-healthcare-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres-healthcare
  template:
    metadata:
      labels:
        app: postgres-healthcare
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-healthcare
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-healthcare
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-healthcare
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "healthcareuser", "-d", "healthcaredb"]
          timeoutSeconds: 5
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "healthcareuser", "-d", "healthcaredb"]
          timeoutSeconds: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: initdb
        configMap:
          name: postgres-healthcare-initdb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: hostpath
      resources:
        requests:
          storage: 1Gi
