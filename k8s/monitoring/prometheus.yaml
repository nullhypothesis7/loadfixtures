apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: testfixtures-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: testfixtures
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['app.testfixtures-app.svc.cluster.local:8080']

      - job_name: postgres-testdb
        static_configs:
          - targets: ['pg-exporter-testdb:9187']
            labels:
              database: testdb

      - job_name: postgres-banking
        static_configs:
          - targets: ['pg-exporter-banking:9187']
            labels:
              database: bankingdb

      - job_name: postgres-healthcare
        static_configs:
          - targets: ['pg-exporter-healthcare:9187']
            labels:
              database: healthcaredb

      - job_name: postgres-bank
        static_configs:
          - targets: ['pg-exporter-bank:9187']
            labels:
              database: bankschemadb

      - job_name: postgres-salesforce
        static_configs:
          - targets: ['pg-exporter-salesforce:9187']
            labels:
              database: salesforcedb

      - job_name: postgres-salesforce-enterprise
        static_configs:
          - targets: ['pg-exporter-salesforce-enterprise:9187']
            labels:
              database: salesforceenterprisedb

      - job_name: kafka-exporter
        static_configs:
          - targets: ['kafka-exporter.testfixtures-messaging.svc.cluster.local:9308']

      - job_name: kafka-jmx
        scrape_interval: 60s
        scrape_timeout: 45s
        static_configs:
          - targets: ['kafka-jmx-exporter.testfixtures-messaging.svc.cluster.local:5556']
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: testfixtures-monitoring
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: testfixtures-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.2
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
