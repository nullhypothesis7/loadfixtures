apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: testfixtures-monitoring
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: testfixtures-monitoring
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: testfixtures
        orgId: 1
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: testfixtures-monitoring
data:
  app-metrics.json: |
    {
      "title": "TestFixtures — App Metrics",
      "uid": "tf-app-metrics",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["testfixtures"],
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (uri, method, status) (rate(http_server_requests_seconds_count{job=\"testfixtures\"}[1m]))",
              "legendFormat": "{{method}} {{uri}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP P99 Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"testfixtures\"}[1m])))",
              "legendFormat": "p99 {{uri}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"testfixtures\"}[1m])))",
              "legendFormat": "p50 {{uri}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "JVM Heap Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_memory_used_bytes{job=\"testfixtures\", area=\"heap\"})",
              "legendFormat": "heap used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_memory_max_bytes{job=\"testfixtures\", area=\"heap\"})",
              "legendFormat": "heap max",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_memory_used_bytes{job=\"testfixtures\", area=\"nonheap\"})",
              "legendFormat": "non-heap used",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "JVM Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_threads_live_threads{job=\"testfixtures\"}",
              "legendFormat": "live",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_threads_daemon_threads{job=\"testfixtures\"}",
              "legendFormat": "daemon",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_threads_peak_threads{job=\"testfixtures\"}",
              "legendFormat": "peak",
              "refId": "C"
            }
          ]
        },
        {
          "id": 5,
          "title": "GC Pause Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(jvm_gc_pause_seconds_sum{job=\"testfixtures\"}[1m])",
              "legendFormat": "{{action}} {{cause}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "percentunit",
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "process_cpu_usage{job=\"testfixtures\"}",
              "legendFormat": "process CPU",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "system_cpu_usage{job=\"testfixtures\"}",
              "legendFormat": "system CPU",
              "refId": "B"
            }
          ]
        }
      ]
    }
  database-metrics.json: |
    {
      "title": "TestFixtures — Database Metrics",
      "uid": "tf-database-metrics",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["testfixtures", "postgres"],
      "panels": [
        {
          "id": 1,
          "title": "Live Row Counts — testdb",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_user_tables_n_live_tup{job=\"postgres-testdb\"}",
              "legendFormat": "{{relname}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Live Row Counts — bankingdb",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_user_tables_n_live_tup{job=\"postgres-banking\"}",
              "legendFormat": "{{relname}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Live Row Counts — healthcaredb",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_user_tables_n_live_tup{job=\"postgres-healthcare\"}",
              "legendFormat": "{{relname}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Live Row Counts — bankschemadb",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_user_tables_n_live_tup{job=\"postgres-bank\"}",
              "legendFormat": "{{schemaname}}.{{relname}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active Connections by Database",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_database_numbackends{job=\"postgres-testdb\", datname!=\"\"}",
              "legendFormat": "testdb / {{datname}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_database_numbackends{job=\"postgres-banking\", datname!=\"\"}",
              "legendFormat": "banking / {{datname}}",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_database_numbackends{job=\"postgres-healthcare\", datname!=\"\"}",
              "legendFormat": "healthcare / {{datname}}",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_database_numbackends{job=\"postgres-bank\", datname!=\"\"}",
              "legendFormat": "bankschema / {{datname}}",
              "refId": "D"
            }
          ]
        },
        {
          "id": 5,
          "title": "Transaction Commit Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_database_xact_commit{job=\"postgres-testdb\", datname!=\"\"}[1m])",
              "legendFormat": "testdb commits",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_database_xact_commit{job=\"postgres-banking\", datname!=\"\"}[1m])",
              "legendFormat": "banking commits",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_database_xact_commit{job=\"postgres-healthcare\", datname!=\"\"}[1m])",
              "legendFormat": "healthcare commits",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_database_xact_commit{job=\"postgres-bank\", datname!=\"\"}[1m])",
              "legendFormat": "bankschema commits",
              "refId": "E"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_database_xact_rollback{job=~\"postgres-.*\", datname!=\"\"}[1m])",
              "legendFormat": "{{job}} rollbacks",
              "refId": "D"
            }
          ]
        },
        {
          "id": 6,
          "title": "Row Insert Rate by Table (all databases)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never" },
              "unit": "rps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max", "last"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(pg_stat_user_tables_n_tup_ins{job=~\"postgres-.*\"}[1m]) > 0",
              "legendFormat": "{{job}} / {{relname}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Dead Tuples (vacuum pressure)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
