          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "pg_stat_user_tables_n_dead_tup{job=~\"postgres-.*\"} > 0",
              "legendFormat": "{{job}} / {{relname}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  kafka-metrics.json: |
    {
      "title": "TestFixtures — Kafka Metrics",
      "uid": "tf-kafka-metrics",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["testfixtures", "kafka"],
      "panels": [
        {
          "id": 1,
          "title": "Brokers Online",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short",
              "noValue": "0",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kafka_brokers",
              "legendFormat": "",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Topics",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              },
              "unit": "short",
              "noValue": "0",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count(kafka_topic_partitions{topic!~\"__.*\"})",
              "legendFormat": "",
              "instant": true,
              "refId": "A"
