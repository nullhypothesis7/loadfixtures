apiVersion: v1
kind: Service
metadata:
  name: pg-exporter-testdb
  namespace: testfixtures-monitoring
spec:
  selector:
    app: pg-exporter-testdb
  ports:
  - port: 9187
    targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-exporter-testdb
  namespace: testfixtures-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-exporter-testdb
  template:
    metadata:
      labels:
        app: pg-exporter-testdb
    spec:
      containers:
      - name: pg-exporter
        image: prometheuscommunity/postgres-exporter:v0.15.0
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://testuser:testpass@postgres-testdb.testfixtures-data.svc.cluster.local:5432/testdb?sslmode=disable"
        ports:
        - containerPort: 9187
          name: metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
